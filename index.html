<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillBond - portable, bonded developer reputation</title>
<meta name="theme-color" content="#0B1020">
<style>
  :root{
    --bg:#0A0F1F; --bg2:#0E1530; --card:#131B38; --card2:#18224A; --line:#26335F; --line2:#33437A;
    --ink:#EEF2FF; --dim:#A9B6DE; --faint:#7886B5;
    --violet:#8B6CFF; --cyan:#27D3EE; --grad:linear-gradient(135deg,#8B6CFF 0%,#27D3EE 100%);
    --good:#34D399; --good-bg:rgba(52,211,153,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.13);
    --bad:#FB7185; --bad-bg:rgba(251,113,133,.13); --info:#60A5FA; --info-bg:rgba(96,165,250,.13);
    --neutral-bg:rgba(169,182,222,.12);
    --bronze:#D58A4B; --silver:#C9D2E6; --gold:#F6C453; --platinum:#7DE8F7;
    --radius:16px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F4F6FF; --bg2:#E9EDFF; --card:#FFFFFF; --card2:#F1F4FF; --line:#D9DFF5; --line2:#C3CCEF;
      --ink:#121A3A; --dim:#4A5782; --faint:#7482AE;
      --good:#0E9F6E; --good-bg:rgba(14,159,110,.12); --warn:#B7791F; --warn-bg:rgba(183,121,31,.13);
      --bad:#D6336C; --bad-bg:rgba(214,51,108,.1); --info:#2563EB; --info-bg:rgba(37,99,235,.1);
      --neutral-bg:rgba(74,87,130,.1); --shadow:0 10px 30px rgba(40,50,110,.12);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:radial-gradient(1200px 500px at 70% -10%,rgba(139,108,255,.18),transparent 60%),
       radial-gradient(900px 500px at -10% 0%,rgba(39,211,238,.12),transparent 55%),var(--bg);
       color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;
       padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.015em}
  h1{font-size:clamp(28px,6.5vw,44px);font-weight:800} h2{font-size:21px;font-weight:750} h3{font-size:16px;font-weight:700}
  p{margin:0 0 10px} .mono,code{font-family:var(--mono);font-size:.86em}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  .dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:13px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
             background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.02em}
  .brand:hover{text-decoration:none}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(139,108,255,.45)}
  .logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .topnav{display:none;gap:4px}
  .topnav a{padding:8px 12px;border-radius:10px;color:var(--dim);font-weight:600;font-size:14px}
  .topnav a:hover{background:var(--neutral-bg);text-decoration:none}
  .topnav a.active{color:var(--ink);background:var(--card2)}
  .wallet-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);
               border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;max-width:58vw;font-family:inherit}
  .wallet-pill .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wallet-pill.on{border-color:var(--good);background:var(--good-bg)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  .wallet-pill.on .dot{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}

  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
             backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
             padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 8px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--faint);
       font-size:11.5px;font-weight:650}
  .tab:hover{text-decoration:none}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--ink);background:var(--card2)}
  .tab.active svg{stroke:var(--cyan)}
  @media (min-width:820px){ .topnav{display:flex} nav.bottom{display:none} body{padding-bottom:40px} }

  main{padding:22px 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card.glow{border-color:var(--line2);box-shadow:var(--shadow)}
  .card h3{margin-bottom:8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1 1 auto;min-width:0}
  .stack{display:grid;gap:12px;min-width:0}
  .stack>*,.copyline>*,.card>*{min-width:0;max-width:100%}
  .copyline .code{min-width:0;overflow-x:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (max-width:520px){ .grid3{grid-template-columns:repeat(2,1fr)} }

  .hero{padding:10px 0 18px}
  .hero p{color:var(--dim);max-width:620px;margin:12px 0 16px;font-size:17px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat b{display:block;font-size:24px;letter-spacing:-.02em}
  .stat span{color:var(--faint);font-size:12.5px;font-weight:600}

  .btn{appearance:none;border:1px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px 16px;
       font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
  .btn:hover{text-decoration:none;filter:brightness(1.1)}
  .btn.primary{background:var(--grad);border-color:transparent;color:#071022}
  .btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .btn.ghost{background:transparent}
  .btn.small{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
  .btn:disabled,.btn.disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.block{width:100%}

  label.field{display:block;margin-bottom:12px}
  label.field>span{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-bottom:6px}
  input,textarea,select{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;
       padding:12px 13px;font:inherit;font-size:16px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(39,211,238,.18)}
  textarea{min-height:86px;resize:vertical}
  .hint{font-size:12.5px;color:var(--faint);margin-top:5px}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .p-pending{background:var(--warn-bg);color:var(--warn)} .p-verified{background:var(--good-bg);color:var(--good)}
  .p-challenged{background:var(--bad-bg);color:var(--bad)} .p-finalized{background:var(--info-bg);color:var(--info)}
  .p-rejected,.p-withdrawn{background:var(--neutral-bg);color:var(--dim)} .p-overturned{background:var(--bad-bg);color:var(--bad)}
  .chip{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--neutral-bg);color:var(--dim);font-size:12px;font-weight:650}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--dim);border-radius:999px;padding:7px 13px;
         font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
  .fchip.on{background:var(--grad);color:#071022;border-color:transparent}

  .claim{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);
         border-radius:var(--radius);padding:14px;margin-bottom:10px;color:var(--ink)}
  .claim:hover{border-color:var(--line2);text-decoration:none;transform:translateY(-1px)}
  .kind{width:44px;height:44px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center}
  .kind svg{width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .claim .st{font-weight:700;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .claim .meta{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .claim .side{text-align:right;display:grid;gap:6px;justify-items:end}
  @media (max-width:520px){ .claim{grid-template-columns:44px 1fr} .claim .side{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left} }
  .pts{font-weight:800;font-size:18px}
  .pts.zero{color:var(--faint)}

  .stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
  .step{text-align:center;font-size:12px;font-weight:700;color:var(--faint)}
  .step .bar{height:6px;border-radius:6px;background:var(--line);margin-bottom:7px}
  .step.done{color:var(--good)} .step.done .bar{background:var(--good)}
  .step.now{color:var(--cyan)} .step.now .bar{background:var(--grad)}
  .step.fail{color:var(--bad)} .step.fail .bar{background:var(--bad)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
  .kv dt{color:var(--faint);font-weight:650} .kv dd{margin:0;overflow-wrap:anywhere}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .code{font-family:var(--mono);font-size:13px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;
        overflow-x:auto;white-space:pre;color:var(--ink)}
  .copyline{display:flex;gap:8px;align-items:stretch}
  .copyline .code{flex:1;white-space:nowrap}
  .banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;border:1px solid}
  .banner.info{background:var(--info-bg);border-color:var(--info)} .banner.warn{background:var(--warn-bg);border-color:var(--warn)}
  .banner.good{background:var(--good-bg);border-color:var(--good)} .banner.bad{background:var(--bad-bg);border-color:var(--bad)}
  .why{font-size:12.5px;color:var(--warn);margin-top:6px}
  .role{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:750;padding:5px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line2)}

  .ring{position:relative;width:132px;height:132px;flex:none}
  .ring svg{width:132px;height:132px;transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .num b{font-size:34px;letter-spacing:-.03em;display:block;line-height:1}
  .ring .num span{font-size:11px;color:var(--faint);font-weight:700}
  .medal{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
  .medal svg{width:30px;height:34px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
  .bar-row .tr{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
  .bar-row .fl{height:100%;border-radius:9px;background:var(--grad)}
  .avatar{width:56px;height:56px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-weight:850;font-size:24px;color:#071022;flex:none}

  .ev{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);font-size:15px}
  .ev .t{font-weight:700;font-size:14px} .ev .d{font-size:12.5px;color:var(--faint);overflow-wrap:anywhere}

  .skel{border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;
        animation:sh 1.3s infinite;height:84px;margin-bottom:10px}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;padding:34px 12px;color:var(--dim)}
  .empty .big{font-size:34px;margin-bottom:6px}

  .tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;width:min(560px,calc(100vw - 24px));
        background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);display:none}
  .tray.show{display:block}
  .tray.ok{border-color:var(--good)} .tray.err{border-color:var(--bad)}
  .tray .tt{font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
  .tray .tb{font-size:13.5px;color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere;max-height:34vh;overflow:auto}
  .spin{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--cyan);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (min-width:820px){ .tray{bottom:24px} }

  .sheet{position:fixed;inset:0;z-index:80;background:rgba(3,6,18,.7);display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet .panel{background:var(--bg2);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  @media (min-width:820px){ .sheet{align-items:center} .sheet .panel{border-radius:22px} }
  .tw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;background:var(--card)}
  .tw.cur{border-color:var(--good);background:var(--good-bg)}
  .todo{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0}
  .todo .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--card2);border:1px solid var(--line2)}
  .todo.done .n{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .todo.next .n{background:var(--grad);color:#071022;border-color:transparent}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t td,table.t th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.t th{color:var(--faint);font-size:12.5px;font-weight:700}
  footer{text-align:center;color:var(--faint);font-size:12.5px;padding:10px 16px 30px}
</style>
</head>

<script type="module">
import { createClient, createAccount } from "https://esm.sh/genlayer-js@latest";
import { studionet } from "https://esm.sh/genlayer-js@latest/chains";

const DEFAULT_CONTRACT_ADDRESS = "0x73f524e9033C1105C095e5c101673015608eE1ab";
const ZERO_ADDRESS = "0x0000000000000000000000000000000000000000";
const WEI_PER_GEN = 1000000000000000000n;
const STATUSES = ["pending", "verified", "challenged", "finalized", "rejected", "overturned", "withdrawn"];
const STATUS_LABEL = {
  pending: "Awaiting verification", verified: "Verified", challenged: "Under challenge", finalized: "Final",
  rejected: "Rejected", overturned: "Overturned", withdrawn: "Withdrawn",
};
const KIND_LABEL = { commit: "Commit", pull_request: "Pull request", release: "Release" };
const BADGE_COLOR = { NONE: "var(--faint)", BRONZE: "var(--bronze)", SILVER: "var(--silver)", GOLD: "var(--gold)", PLATINUM: "var(--platinum)" };
const LIST_LIMIT = 15;
const SESSION_SLOT = "skillbond.testwallets";

const $ = (sel, root = document) => root.querySelector(sel);

/* ---------- contract address: ?contract=0x... , then saved value, then the default ---------- */
function resolveContract() {
  const ok = (v) => /^0x[0-9a-fA-F]{40}$/.test(String(v || ""));
  try {
    const q = new URLSearchParams(location.search).get("contract");
    if (ok(q)) { try { localStorage.setItem("skillbond.contract", q); } catch (e) {} return q; }
  } catch (e) {}
  if (DEFAULT_CONTRACT_ADDRESS !== ZERO_ADDRESS) return DEFAULT_CONTRACT_ADDRESS;
  try { const s = localStorage.getItem("skillbond.contract"); if (ok(s)) return s; } catch (e) {}
  return DEFAULT_CONTRACT_ADDRESS;
}
const CONTRACT_ADDRESS = resolveContract();
$("#contractAddrText").textContent = CONTRACT_ADDRESS === ZERO_ADDRESS ? "not set" : short(CONTRACT_ADDRESS);

/* ---------- tiny DOM helper: contract data is only ever inserted as text ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
  }

  const slash = bpsOf(B, k.slash_bps), toCh = bpsOf(slash, k.challenger_share_bps);
  const minStake = (B * BigInt(k.challenge_stake_bps) + 9999n) / 10000n;
  const rows = [
    ["No evidence match at verification", `Claimant gets back ${gen(B - bpsOf(B, k.reject_fee_bps))}; ${gen(bpsOf(B, k.reject_fee_bps))} goes to the keeper pool.`],
    ["Challenge upheld", `Claimant loses ${gen(slash)} (keeps ${gen(B - slash)}). Challenger gets stake back + ${gen(toCh)}. Pool gets ${gen(slash - toCh)}.`],
    ["Challenge dismissed", `Challenger loses the stake: ${k.dismiss_claimant_share_bps / 100}% to the claimant, the rest to the pool. Claim earns +${k.survival_bonus} score.`],
    ["Challenge limit", `${k.max_challenges} per claim, voided ones included.`],
    ["Minimum challenge stake", gen(minStake)],
    ["Release the bond", `After the ${dur(k.challenge_window_seconds)} challenge window with no open challenge. Score stays.`],
  ];
  return h("table", { class: "t" }, h("tbody", {}, ...rows.map(([a, b]) => h("tr", {}, h("td", { text: a, style: "font-weight:700;width:38%" }), h("td", { class: "dim", text: b })))));
}

/* ---------- router ---------- */
function route() {
  const token = ++renderToken;
  const stale = () => token !== renderToken;
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/([a-z]*)\/?(.*)$/) || [];
  const name = m[1] || "", arg = decodeURIComponent(m[2] || "");
  const tab = { "": "explore", claim: "explore", new: "new", profile: "profile", ledger: "ledger", guide: "guide", integrate: "integrate", demo: "demo" }[name] || "explore";
  document.querySelectorAll("[data-tab]").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  window.scrollTo(0, 0);
  const run = { "": () => viewExplore(stale), claim: () => viewClaim(arg, stale), new: () => viewNew(stale), profile: () => viewProfile(arg, stale),
    ledger: () => viewLedger(stale), guide: () => viewGuide(stale), integrate: () => viewIntegrate(stale), demo: () => viewDemo(stale) }[name] || (() => viewExplore(stale));
  run().catch((e) => { if (!stale()) mount(errorBox(e)); });
}
window.addEventListener("hashchange", route);
try { const s = readTestWallets(); if (s.current >= 0 && s.keys[s.current]) useTestWallet(s.current, true); } catch (e) { writeTestWallets({ keys: [], current: -1 }); }
setStatus();
route();
